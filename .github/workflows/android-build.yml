name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode or generate debug keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding DEBUG_KEYSTORE_BASE64 from secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/debug.keystore
          elif [ ! -f app/keystore/debug.keystore ]; then
            echo "Generating debug keystore with alias androidandikune for build..."
            keytool -genkey -v -keystore app/keystore/debug.keystore -storepass android -alias androidandikune -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RAiO, OU=Android, O=RAiO, L=Jakarta, ST=Jakarta, C=ID"
          fi
          chmod 600 app/keystore/debug.keystore

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD || 'android' }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS || 'androidandikune' }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Clean up keystore
        if: always()
        run: rm -f app/keystore/debug.keystore
